{% extends "base.html" %}{% block body %}
<h2>{{ 'Edit ' ~ app.name if editing else 'New app' }}</h2>
<form method="post" class="card">
{% if not editing %}<label>Name</label><input name="name" value="{{ app.name or '' }}" placeholder="myapp" required>{% endif %}
<div class="row"><div><label>Provider</label>
<select name="provider"><option value="github" {{ 'selected' if app.provider=='github' }}>GitHub</option>
<option value="gitlab" {{ 'selected' if app.provider=='gitlab' }}>GitLab</option></select></div>
<div><label>Branch</label><input name="branch" value="{{ app.branch or 'main' }}"></div></div>
<label>Repository URL</label><input name="repo_url" value="{{ app.repo_url or '' }}" placeholder="https://github.com/user/repo.git" required>
<label>Access token <small>(private repos only{{ '; leave blank to keep current' if editing }})</small></label>
<input type="password" name="token" autocomplete="new-password">
<div class="row"><div><label>Domain</label><input name="domain" value="{{ app.domain or '' }}" placeholder="myapp.example.com" required></div>
<div><label>Container port</label><input name="port" value="{{ app.port or 80 }}" required></div></div>
<label>Environment variables <small>(KEY=value, one per line)</small></label>
<textarea name="env" rows="5">{{ app.env or '' }}</textarea>
<p><button class="btn">{{ 'Save' if editing else 'Create & deploy' }}</button>
<a class="btn ghost" href="/">Cancel</a></p></form>
{% endblock %}
